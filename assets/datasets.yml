# Sources for the benchmark. Everything a reader needs to obtain the same bytes.
#
# A note on why these are the "all" files and not the representative ones. SATIVA judges a
# sequence by removing it and placing it back, so it needs at least one other sequence of the
# same taxon to place it against. Any representative database has one sequence per species by
# construction, which makes species-level leave-one-out impossible, not merely hard:
#
# Judgeable at species, every row by one rule in bin/dataset_shape.py, as a fraction of the whole
# set. The two sets the benchmark actually runs on are the two GTDB subsets:
#
#   GTDB r226 ar53_ssu_reps     :  4448 sequences ->  0.0 %   one sequence per species
#                                 (78.4 % at genus; the whole protocol table, reps and ssu_all
#                                 before and after the length filter with the two-genome share,
#                                 is data/gtdb/dataset_table.json from bin/dataset_table.py, and
#                                 bin/verify_manifests.py holds this file to it)
#   gtdb_arc2k, the grid's set  :  2023 sequences -> 74.9 %
#   gtdb_arc1200, the headline  :  7051 sequences -> 72.7 %
#   UNITE v10.0 RefS            : 20295 sequences ->  4.3 %
#   UNITE v10.0 RepS, secondary : 81842 sequences -> 10.9 %
#
# The two UNITE rows were published as 8.5 % and 85.7 % until the unresolved-label forms were
# counted properly; see unite_fungi below. RepS is still the right choice of the two and by a much
# smaller margin than it looked, and 10.9 % is a weak instrument rather than a strong one.
#
# The primary sets were checked for the same defect and do not have it. GTDB writes an unnamed
# species per cluster -- s__JAJYEA01 sp021809545, 595 such labels over 1235 sequences at 2023, the
# largest holding 32 -- so two sequences sharing one are conspecific by GTDB's own definition.
# There is no catch-all label at any rank, no empty rank, and every lineage is seven deep. That is
# the opposite of Cortinarius_sp, which 62129 sequences share and which asserts nothing.
#
# Measured on the released files, not assumed.

datasets:

  gtdb_archaea_ssu:
    description: GTDB r226 SSU, archaea, every sequence rather than species representatives
    release: r226 (226.0)
    url: https://data.gtdb.ecogenomic.org/releases/release226/226.0/genomic_files_all/ssu_all_r226.fna.gz
    sha256: 79aab42a3b0190c0913b697fc7e0b756a76b75668414fdce1f3aeae9569540ea
    downloaded: 2026-10-01
    citation: "Parks DH et al. GTDB: an ongoing census of bacterial and archaeal diversity. Nucleic Acids Res (2022)"
    licence: CC BY-SA 4.0
    # Taxonomy travels in the FASTA header, after the accession, as d__...;s__...
    select: "lineage starts with d__Archaea, then length >= 1200 nt"
    # GTDB publishes no SSU alignment, which is why this benchmark aligns the sequences itself
    # against the covariance model below -- the first question a reader asks of that step. Checked
    # against the release listing on 2026-10-07: genomic_files_all/ holds ssu_all_r226.fna.gz and
    # genomic_files_reps/ holds bac120_ssu_reps_r226.fna.gz and ar53_ssu_reps_r226.fna.gz, all
    # unaligned nucleotide FASTA -- the records selected here run 1 200 to 2 684 nt. What the
    # release does publish aligned is bac120_msa_reps_r226.faa.gz and ar53_msa_reps_r226.faa.gz,
    # the concatenated marker-gene PROTEIN alignment behind the genome tree, and bac120_r226.tree
    # and ar53_r226.tree, whose tips are genomes and whose branch lengths are amino-acid
    # substitutions. Neither is an SSU alignment and neither is a substitute for one.
    published_ssu_alignment: none; the release ships unaligned .fna for SSU
    counts:
      in_release: 1053664
      after_domain: 13754
      after_length: 7051
    # Share of SEQUENCES whose taxon has at least two members, which is what leave-one-out
    # needs: a sequence that is the only member of its taxon cannot be judged at that rank.
    # The comment here used to read "taxa with at least two members", which is a different
    # statistic on the same file -- at species it is 37.3 % against the 72.7 % below, so the
    # label was off by 35 points while the numbers stayed put.
    #
    # Recorded for both stages because the length filter is not free, and the figure that
    # belongs beside a result is the one for the set that produced it. bin/subset_taxa.py and
    # REVIEW.md already reason from 72.7 %; only this file and the protocol said 81.5 %.
    # Both blocks reproduce with:
    #   bin/dataset_shape.py --fasta data/gtdb/gtdb_arc1200.fasta \
    #     --tax data/gtdb/gtdb_arc1200.tax --convention gtdb
    judgeable_pct_after_length:   # the 7051 sequences every measurement here was made on
      domain: 100.0
      phylum: 100.0
      class: 99.9
      order: 99.6
      family: 98.0
      genus: 91.7
      species: 72.7
    judgeable_pct_after_domain:   # the 13754 before >= 1200 nt; the candidate comparison
      domain: 100.0
      phylum: 100.0
      class: 100.0
      order: 99.8
      family: 99.1
      genus: 95.7
      species: 81.5

  # The kind 6 donors. Declared here because the phylum was a parameter nothing recorded:
  # slurm/fetch_bacteria.sh takes the most abundant bacterial phylum in the release, by counting
  # headers, so the choice lived in `head -1` over a generated file and in nothing a reader could
  # consult. It resolves to Pseudomonadota for r226 at 543726 sequences against Bacillota's 306490,
  # and a release where that order changed would quietly change what error kind 6 means. Naming it
  # makes the change visible; the rule stays as it is so the pool is still the largest pool
  # available rather than a hand-picked clade.
  gtdb_bacteria_donors:
    description: GTDB r226 SSU, the bacterial pool error kind 6 draws its foreign sequences from
    release: r226 (226.0)
    source: gtdb_archaea_ssu's file, the same ssu_all_r226.fna.gz and the same sha256
    phylum: p__Pseudomonadota
    phylum_rule: the most abundant bacterial phylum in the release, counted from the headers
    select: "lineage starts with d__Bacteria;p__Pseudomonadota, then length >= 1200 nt"
    counts:
      in_release: 1053664
      after_domain: 543726
      after_length: 392425
      drawn: 600
    seed: 42
    # 600 is three seeds x 101 donors at the top rate of 5 % of 2023, with room over.
    drawn_rule: random sample with seed 42, recorded in data/bacteria/donor_pool.subsample.json
    aligned_with: the same Rfam RF01959 covariance model as the archaea, cmalign --matchonly, so
      the two alignments have one width and concatenate
    citation: "Parks DH et al. GTDB: an ongoing census of bacterial and archaeal diversity. Nucleic Acids Res (2022)"
    licence: CC BY-SA 4.0

  # Alignment model. A covariance model represents rRNA secondary structure; a profile HMM
  # does not. Alignment is not what this paper is about, so the point is to use the method a
  # reviewer cannot argue with.
  rfam_ssu_archaea:
    description: Rfam RF01959, SSU_rRNA_archaea, the covariance model the archaeal SSU is aligned against
    release: Rfam 15.1
    accession: RF01959
    url: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/Rfam.cm.gz
    sha256: e2e636e9ce138dae506769aa74d067ce35466e94002818cfe125ea2a3cab8168
    downloaded: 2026-10-01
    built_with: INFERNAL 1.1.4
    extract: "cmfetch Rfam.cm RF01959"
    # The sha256 above is the whole Rfam.cm.gz; this is the extracted model as committed, so the
    # file the alignments actually used can be checked without downloading 15.1 again. It is Rfam's
    # published RF01959: fetched from rfam.org/family/RF01959/cm, the two differ on one line, the
    # padding of a DESC field that cmfetch writes differently from the per-family download, and the
    # model's own CKSUM is 2012181519 in both files and both blocks.
    extracted_file: data/gtdb/RF01959.cm
    extracted_sha256: 894aa1b3c0f566e8f4e1c74a6578876763027d4cda062a419004652a7229edfd
    # CLEN, the model's consensus length, is 1478. cmalign --matchonly keeps exactly those columns,
    # so every alignment here is 1478 wide -- checked on all three: 7051 archaeal, 2023 in the grid's
    # subset, 600 bacterial donors. That shared width is what lets the donors be concatenated into
    # the archaeal alignment for error kind 6, and it is a property of the model, not a coincidence.
    consensus_length: 1478
    citation: "Ontiveros-Palacios N et al. Rfam 15: RNA families database. Nucleic Acids Res (2025)"

  rfam_ssu_bacteria:
    description: Rfam RF00177, SSU_rRNA_bacteria, the covariance model the bacterial clade is aligned against
    release: Rfam 15.1
    accession: RF00177
    # The same pinned Rfam.cm.gz as rfam_ssu_archaea, extracted by cmfetch inside
    # slurm/fetch_bacterial_clade.sh rather than by hand, from the Infernal image pinned below.
    source: rfam_ssu_archaea's Rfam.cm.gz, same url and sha256
    extract: "cmfetch Rfam.cm RF00177"
    extracted_file: data/gtdb/RF00177.cm
    extracted_sha256: 1b3f89384c82c215e9f840637fdf8588e58e4c33954240e761a8d91ec6dd9d8e
    # The bacterial model is 55 columns wider than the archaeal one, so this clade's alignment is
    # 1533 wide and cannot be concatenated with the archaeal one; it never needs to be.
    consensus_length: 1533
    citation: "Ontiveros-Palacios N et al. Rfam 15: RNA families database. Nucleic Acids Res (2025)"

  infernal_image:
    description: the container every cmalign and cmfetch here runs in, pinned by tag and pulled when the cache lacks it
    image: quay.io/biocontainers/infernal:1.1.5--pl5321h7b50bb2_4
    sif_sha256: 40c12bdb4bb59443accc09f5b15e0e8a6d3b9d086fded8e46329f4c4b52f70ac
    # It used to be found by globbing ~/.singularity_cache, and the cache was pruned between two
    # runs: review finding 228. slurm/fetch_bacterial_clade.sh and slurm/make_foreign.sh pull it.

  gtdb_bacteria_clade:
    description: GTDB r226 SSU, the bacterial order the archaeal results are replicated on
    release: r226 (226.0)
    source: gtdb_archaea_ssu's file, the same ssu_all_r226.fna.gz and the same sha256
    clade: d__Bacteria;p__Bacillota;c__Clostridia;o__Lachnospirales
    clade_rule: >
      the bacterial class or order minimising |n_1200 - 7051| / 7051 + |judgeable_species - 72.7| / 72.7,
      computed by bin/select_bacterial_clade.py over every candidate of the release and recorded with
      the ten runners-up in data/gtdb/bacterial_clade_selection.json
    select: "lineage starts with d__Bacteria;p__Bacillota;c__Clostridia;o__Lachnospirales, then length >= 1200 nt"
    aligned_with: Rfam RF00177 (rfam_ssu_bacteria), cmalign --matchonly, in infernal_image
    counts:
      in_release: 1053664
      after_domain: 14473
      after_length: 6929
      subset: 2008
    subset_rule: bin/subset_taxa.py --target 2000 --seed 42, whole species groups, as gtdb_arc2k
    # From data/gtdb/dataset_table_bac.json, the protocol's table for this clade.
    judgeable_pct_after_length:
      genus: 99.2
      species: 96.2
      species_two_genomes: 88.5
    citation: "Parks DH et al. GTDB: an ongoing census of bacterial and archaeal diversity. Nucleic Acids Res (2022)"
    licence: CC BY-SA 4.0

  raxmlgrove:
    description: RAxMLGrove, the database the simulated control's tree and model parameters are drawn from
    url: https://cme.h-its.org/exelixis/material/raxmlgrove/latest_all.db
    sha256: 339577e4e427c2df95ea9ce7c69eb3f1cab10f279a2d3ecb98eda980e53f1182
    bytes: 146669568
    scripts: https://github.com/angtft/RAxMLGroveScripts
    scripts_commit: 7d8e2aa469968b49a52db5cc437307deb18eb233
    n_trees: 127329
    tree_id: "71741"
    # bin/grove_select.py's criteria and candidate count are in data/grove/tree.json; the
    # simulator is the AliSim shipped inside the pinned scripts repository.
    citation: "Höhler D et al. RAxML Grove: an empirical phylogenetic tree database. Bioinformatics 38(6):1741 (2022)"

  unite_fungi:
    description: UNITE general FASTA release for Fungi, RepS subset
    release: v10.0 (2025-02-19)
    doi: 10.15156/BIO/3301229
    url: https://s3.hpc.ut.ee/plutof-public/original/9489f7bc-7cc1-4e0a-84dc-c732476b9acd.tgz
    sha256: a340864f947c517b671f1054a261e613a6619ef88dd8000de1699f5e1f21413b
    downloaded: 2026-10-01
    member: sh_general_release_dynamic_19.02.2025.fasta
    licence: CC BY-SA 4.0
    # Field 4 of the '|'-separated header is the subset marker.
    select: "header field 4 == reps"
    counts:
      in_release: 102137
      refs: 16120
      refs_singleton: 4175
      reps: 81842
    # Two denominators, because one of them alone is wrong and was published. UNITE marks an
    # unresolved rank with a form of its own at each level -- Ascomycota_phy_Incertae_sedis,
    # ..._cls_, ..._ord_, ..._fam_, Ascomycota_gen_Incertae_sedis, and Cortinarius_sp at species,
    # plus bare GS codes at class and order. A sequence labelled Tomentella_sp shares that label
    # with 2726 others and is not thereby known to be the same species as any of them, so
    # leave-one-out judging one against another is not judging a species label at all. The 62129
    # below is every such sequence at species, spread over many X_sp labels and not one group:
    # the largest are Tomentella_sp at 2727, Ascomycota_sp at 2336 and Fungi_sp at 1666. This
    # comment named 62128 siblings of one label, which is the total mistaken for a group.
    #
    # That this is the whole of the difference was checked and not inferred: scoring the same file
    # with every label taken as resolved returns 98.2 % at genus and 85.7 % at species, which are
    # the two figures that were published, reproduced to the decimal.
    #
    # of_labelled is among sequences with a resolved label at the rank; of_all is out of all 81842,
    # which is the ceiling any recall figure has to be read against. Measured by
    # bin/dataset_shape.py, whose counts reproduce the label inventory exactly.
    # The RefS subset of the same release, measured the same way, as the comparison that chose
    # RepS. The rule reproduces the published 90.6 % at genus exactly, which is the reason to
    # believe it where it corrects the others: species was published as 8.5 % and is 4.5 % of
    # labelled sequences, 4.3 % of all 20295.
    refs_judgeable_pct:
      genus:   {of_labelled: 90.6, of_all: 89.7, unresolved: 206}
      species: {of_labelled: 4.5,  of_all: 4.3,  unresolved: 971}
    judgeable_pct:
      phylum:  {of_labelled: 100.0, of_all: 97.7, unresolved: 1846}
      class:   {of_labelled: 100.0, of_all: 90.4, unresolved: 7828}
      order:   {of_labelled: 100.0, of_all: 86.1, unresolved: 11332}
      family:  {of_labelled: 99.8,  of_all: 71.7, unresolved: 23016}
      genus:   {of_labelled: 97.4,  of_all: 59.9, unresolved: 31482}
      species: {of_labelled: 45.3,  of_all: 10.9, unresolved: 62129}
    # ITS is not as length-variable as its reputation: 421 to 666 nt between the 5th and 95th
    # percentiles, a ratio of 1.58, median 524. So an alignment of this set is not mostly gap.
    # That bounds one failure mode and not the other -- equal length is not homology, and ITS has
    # no conserved structure to align against the way 16S has a covariance model.
    length_nt: {min: 140, p5: 421, median: 524, p95: 666, max: 1491, p95_over_p5: 1.58}
    lineages: all 7 ranks deep, none empty
    sha256_rechecked: 2026-10-03, unchanged
    status: secondary, needs an alignment step; ITS alignment is contested, see the protocol
