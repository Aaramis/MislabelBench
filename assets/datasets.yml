# Sources for the benchmark. Everything a reader needs to obtain the same bytes.
#
# A note on why these are the "all" files and not the representative ones. SATIVA judges a
# sequence by removing it and placing it back, so it needs at least one other sequence of the
# same taxon to place it against. Any representative database has one sequence per species by
# construction, which makes species-level leave-one-out impossible, not merely hard:
#
#   GTDB r226 ar53_ssu_reps : 4448 sequences, 4448 distinct species ->  0.0 % judgeable
#   GTDB r226 ssu_all, archaea : 13754 sequences                    -> 81.5 % judgeable
#   UNITE v10.0 RefS           : 20295 sequences                    ->  8.5 % judgeable
#   UNITE v10.0 RepS           : 81842 sequences                    -> 85.7 % judgeable
#
# Measured on the released files, not assumed. The same reasoning rules out RefS despite it
# being the more curated UNITE subset.

datasets:

  gtdb_archaea_ssu:
    description: GTDB r226 SSU, archaea, every sequence rather than species representatives
    release: r226 (226.0)
    url: https://data.gtdb.ecogenomic.org/releases/release226/226.0/genomic_files_all/ssu_all_r226.fna.gz
    sha256: 79aab42a3b0190c0913b697fc7e0b756a76b75668414fdce1f3aeae9569540ea
    downloaded: 2026-10-01
    citation: "Parks DH et al. GTDB: an ongoing census of bacterial and archaeal diversity. Nucleic Acids Res (2022)"
    licence: CC BY-SA 4.0
    # Taxonomy travels in the FASTA header, after the accession, as d__...;s__...
    select: "lineage starts with d__Archaea, then length >= 1200 nt"
    counts:
      in_release: 1053664
      after_domain: 13754
      after_length: 7051
    judgeable_pct:   # taxa with at least two members, by rank
      domain: 100.0
      phylum: 100.0
      class: 100.0
      order: 99.8
      family: 99.1
      genus: 95.7
      species: 81.5

  # Alignment model. A covariance model represents rRNA secondary structure; a profile HMM
  # does not. Alignment is not what this paper is about, so the point is to use the method a
  # reviewer cannot argue with.
  rfam_ssu_archaea:
    description: Rfam RF01959, SSU_rRNA_archaea, the covariance model the archaeal SSU is aligned against
    release: Rfam 15.1
    accession: RF01959
    url: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/Rfam.cm.gz
    sha256: e2e636e9ce138dae506769aa74d067ce35466e94002818cfe125ea2a3cab8168
    downloaded: 2026-10-01
    built_with: INFERNAL 1.1.4
    extract: "cmfetch Rfam.cm RF01959"
    citation: "Ontiveros-Palacios N et al. Rfam 15: RNA families database. Nucleic Acids Res (2025)"

  unite_fungi:
    description: UNITE general FASTA release for Fungi, RepS subset
    release: v10.0 (2025-02-19)
    doi: 10.15156/BIO/3301229
    url: https://s3.hpc.ut.ee/plutof-public/original/9489f7bc-7cc1-4e0a-84dc-c732476b9acd.tgz
    sha256: a340864f947c517b671f1054a261e613a6619ef88dd8000de1699f5e1f21413b
    downloaded: 2026-10-01
    member: sh_general_release_dynamic_19.02.2025.fasta
    licence: CC BY-SA 4.0
    # Field 4 of the '|'-separated header is the subset marker.
    select: "header field 4 == reps"
    counts:
      in_release: 102137
      refs: 16120
      refs_singleton: 4175
      reps: 81842
    # Two denominators, because one of them alone is wrong and was published. UNITE marks an
    # unresolved rank with a form of its own at each level -- Ascomycota_phy_Incertae_sedis,
    # ..._cls_, ..._ord_, ..._fam_, Ascomycota_gen_Incertae_sedis, and Cortinarius_sp at species,
    # plus bare GS codes at class and order. A sequence labelled Cortinarius_sp shares that label
    # with 62128 others and is not thereby known to be the same species as any of them, so
    # leave-one-out judging one against another is not judging a species label at all.
    #
    # of_labelled is among sequences with a resolved label at the rank; of_all is out of all 81842,
    # which is the ceiling any recall figure has to be read against. Measured by
    # bin/unite_shape.py, whose counts reproduce the label inventory exactly.
    judgeable_pct:
      phylum:  {of_labelled: 100.0, of_all: 97.7, unresolved: 1846}
      class:   {of_labelled: 100.0, of_all: 90.4, unresolved: 7828}
      order:   {of_labelled: 100.0, of_all: 86.1, unresolved: 11332}
      family:  {of_labelled: 99.8,  of_all: 71.7, unresolved: 23016}
      genus:   {of_labelled: 97.4,  of_all: 59.9, unresolved: 31482}
      species: {of_labelled: 45.3,  of_all: 10.9, unresolved: 62129}
    # ITS is not as length-variable as its reputation: 421 to 666 nt between the 5th and 95th
    # percentiles, a ratio of 1.58, median 524. So an alignment of this set is not mostly gap.
    # That bounds one failure mode and not the other -- equal length is not homology, and ITS has
    # no conserved structure to align against the way 16S has a covariance model.
    length_nt: {min: 140, p5: 421, median: 524, p95: 666, max: 1491, p95_over_p5: 1.58}
    lineages: all 7 ranks deep, none empty
    sha256_rechecked: 2026-10-03, unchanged
    status: secondary, needs an alignment step; ITS alignment is contested, see the protocol
